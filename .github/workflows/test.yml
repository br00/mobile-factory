name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos-system-python:
    # The python3 that ships with macOS is what most users run bin/mf with.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: /usr/bin/python3 --version
      - run: bash -n targets/ios/fast.sh && bash -n targets/android/fast.sh
      - run: /usr/bin/python3 -m unittest discover -s tests -v

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
